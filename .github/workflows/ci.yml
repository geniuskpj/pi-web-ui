name: CI

# Replaces the first ci.yml attempt (2026-10-23), which ran `npm ci` + build but
# inherited the same trap the feat/auth-gate-retry branch had already fixed:
# npm 9/10 SILENTLY DROP `overrides` entries that use `file:` specifiers (npm 11
# honours them), so on CI the provider SDKs resolve to the REAL packages and
# the build follows them into missing transitive deps. build.mjs now aliases
# the six provider SDKs to stubs/empty itself (ported from the branch with the
# stub-assertion proof), so the bundle is independent of how npm resolved them.
#
# Real-LLM suites (test:agent, test:steer, test:killstop) are deliberately NOT
# run here: they need provider keys and minutes of wall time. Terminal smoke and
# platform-backend tests run on both Windows and Ubuntu to protect both paths.

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: "Install (lockfile-pinned)"
        run: npm ci

      - name: Version report
        run: |
          node --version
          npm --version

      - name: Typecheck
        run: npm run typecheck

      - name: "Build (esbuild bundle + provider-stub assertions)"
        run: npm run build

      # Hermetic, node-only suites (no provider keys, no pty/bash, scratch
      # servers on random ports with a temp data dir where needed).
      - name: "Tests (store, runtime, ssrf, zombie, versions)"
        run: |
          npm run test:store
          npm run test:runtime
          npm run test:ssrf
          npm run test:zombie
          npm run test:versions
      - name: "Tests (security gates — token + origin/Host allowlist)"
        run: npm run test:security

      - name: "Tests (terminal platform + WebSocket smoke)"
        run: |
          npm run test:term-platform
          npm test

  publish-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package runnable app
        run: |
          mkdir -p release-package/lib release-package/public release-package/stubs
          cp package.json package-lock.json README.md \
            server.mjs agent-hub.mjs terminal-hub.mjs terminal-backends.mjs \
            process-tree.mjs session-id.mjs session-worker.mjs release-package/
          cp -R lib/. release-package/lib/
          cp -R public/. release-package/public/
          cp -R stubs/. release-package/stubs/
          tar -czf pi-web-ui.tar.gz -C release-package .

      - name: Upload archive to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" pi-web-ui.tar.gz --clobber
